<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="referrer" content="no-referrer">
<title>리나 할 일</title>
<script>
// 할 일 목록은 주소의 # 뒤에만 있습니다(서버로 전송되지 않음). 텔레그램 스크립트보다 먼저 읽어 둡니다.
window.__RAW_HASH = location.hash || '';
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#222);--hint:var(--tg-theme-hint-color,#888);--btn:var(--tg-theme-button-color,#2a8bf2);--btx:var(--tg-theme-button-text-color,#fff);--sec:var(--tg-theme-secondary-bg-color,#f2f2f5)}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:12px 14px 4px}h1{font-size:19px;margin:0}small{color:var(--hint)}
.tabs{display:flex;gap:6px;padding:8px 14px}.tabs button{flex:1}
button{border:0;border-radius:10px;padding:9px 10px;font-size:15px;background:var(--sec);color:var(--tx)}
button.on,button.pri{background:var(--btn);color:var(--btx)}
ul{list-style:none;margin:0;padding:0 10px}li{background:var(--sec);border-radius:12px;margin:6px 0;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
li .chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--btn);flex:none;margin-top:1px;padding:0;background:transparent}
li.done .chk{background:var(--btn)}li.done .t{text-decoration:line-through;color:var(--hint)}
li .body{flex:1}li .meta{color:var(--hint);font-size:13px}li.changed{outline:2px dashed var(--btn)}
.empty{color:var(--hint);text-align:center;padding:30px}
form{padding:10px 14px;display:none}form.show{display:block}label{display:block;margin:8px 0 3px;font-size:14px;color:var(--hint)}
input,textarea{width:100%;padding:9px;border-radius:10px;border:1px solid var(--sec);background:var(--sec);color:var(--tx);font-size:16px}
.row{display:flex;gap:6px;flex-wrap:wrap}.row button{flex:1;min-width:60px}
.foot{display:flex;gap:6px;padding:12px 14px}
#add{margin:8px 14px;width:calc(100% - 28px)}
</style>
</head>
<body>
<header><h1>📋 리나 할 일</h1><small id="asof"></small></header>
<div class="tabs"><button id="tOpen" class="on">해야 할 일</button><button id="tDone">완료(7일)</button></div>
<button id="add" class="pri">＋ 할 일 추가</button>
<ul id="list"></ul>
<form id="f">
  <label>할 일</label><input id="fTitle" maxlength="300">
  <label>언제까지</label><div class="row"><button type="button" data-d="0">오늘</button><button type="button" data-d="1">내일</button><button type="button" data-d="">없음</button></div>
  <input id="fDue" type="date" style="margin-top:6px">
  <label>알림 (비우면 없음)</label><input id="fRem" type="datetime-local">
  <label>분류</label><div class="row" id="fCat"></div>
  <label>중요도</label><div class="row" id="fPrio"></div>
  <label>메모</label><textarea id="fMemo" rows="2" maxlength="1000"></textarea>
  <div class="foot"><button type="button" id="fCancel">닫기</button><button type="button" id="fDel">삭제</button><button type="button" id="fOk" class="pri">확인</button></div>
</form>
<p class="empty" id="msg" style="display:none"></p>
<script>
(function(){
const tg = window.Telegram && Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); }
const CATS=['집','건강','쇼핑','약속','기타'], PRIOS=['보통','중요'];
function readData(){
  const h = window.__RAW_HASH.replace(/^#/, '');
  for (const part of h.split(/[&?]/)) { if (part.startsWith('d=')) {
    let s = part.slice(2).replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '=';
    const bin = atob(s); const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes)); } }
  return null;
}
let data; try { data = readData(); } catch(e) { data = null; }
const $ = id => document.getElementById(id);
if (!data || data.v !== 1) { $('msg').style.display='block'; $('msg').textContent='리나 봇 1:1 대화에서 "할 일 앱"이라고 보내 열어 주세요.'; $('add').style.display='none'; document.querySelector('.tabs').style.display='none'; return; }
$('asof').textContent = '기준: ' + data.at.replace('T',' ').slice(0,16);
const items = data.items.map(x => Object.assign({}, x));
const ops = new Map(); let tab='open', editing=null, tmpN=0;
function kst(d){ const t=new Date(Date.now()+9*3600e3+d*864e5); return t.toISOString().slice(0,10); }
function chips(box, arr){ box.innerHTML=''; arr.forEach(v=>{const b=document.createElement('button');b.type='button';b.textContent=v;b.onclick=()=>{[...box.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');};box.appendChild(b);}); }
function pick(box){ const b=[...box.children].find(c=>c.classList.contains('on')); return b?b.textContent:null; }
function setPick(box,v){ [...box.children].forEach(c=>c.classList.toggle('on',c.textContent===v)); }
chips($('fCat'),CATS); chips($('fPrio'),PRIOS);
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ $('fDue').value = b.dataset.d===''?'':kst(+b.dataset.d); });
function render(){
  const ul=$('list'); ul.innerHTML='';
  const shown = items.filter(x=>x.s===(tab==='open'?'open':'done'));
  if(!shown.length){ ul.innerHTML='<p class="empty">'+(tab==='open'?'할 일이 없어요 🎉':'최근 완료한 일이 없어요')+'</p>'; }
  shown.forEach(x=>{
    const li=document.createElement('li'); if(x.s==='done') li.classList.add('done'); if(ops.has(x.i)) li.classList.add('changed');
    const c=document.createElement('button'); c.className='chk'; c.setAttribute('aria-label','완료');
    c.onclick=()=>{ toggle(x); };
    const body=document.createElement('div'); body.className='body';
    const t=document.createElement('div'); t.className='t'; t.textContent=(x.p==='중요'?'⭐ ':'')+x.t;
    const m=document.createElement('div'); m.className='meta';
    m.textContent=[x.c, x.d?('~'+x.d):'', x.r?('⏰'+x.r.replace('T',' ').slice(5)):'' , x.m||''].filter(Boolean).join(' · ');
    body.append(t,m); body.onclick=()=>openForm(x);
    li.append(c,body); ul.appendChild(li);
  });
  updateMain();
}
function toggle(x){
  const prev = ops.get(x.i);
  if (x.i.startsWith('new')) { x.s = x.s==='open'?'done':'open'; }
  else if (x.s==='open') { x.s='done'; ops.set(x.i,{op:'done',id:x.i}); }
  else { x.s='open'; if(prev && prev.op==='done') ops.delete(x.i); else ops.set(x.i,{op:'reopen',id:x.i}); }
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  render();
}
function openForm(x){
  editing = x || null;
  $('fTitle').value = x?x.t:''; $('fDue').value = x&&x.d?x.d:''; $('fRem').value = x&&x.r?x.r.slice(0,16):'';
  setPick($('fCat'), x?x.c:'기타'); setPick($('fPrio'), x?x.p:'보통'); $('fMemo').value = x&&x.m?x.m:'';
  $('fDel').style.display = x?'':'none';
  $('f').classList.add('show'); $('list').style.display='none'; $('add').style.display='none'; $('fTitle').focus();
}
function closeForm(){ $('f').classList.remove('show'); $('list').style.display=''; $('add').style.display=''; render(); }
$('add').onclick=()=>openForm(null); $('fCancel').onclick=closeForm;
$('fDel').onclick=()=>{ const x=editing; const i=items.indexOf(x); if(i>=0) items.splice(i,1);
  if (x.i.startsWith('new')) ops.delete(x.i); else ops.set(x.i,{op:'delete',id:x.i}); closeForm(); };
$('fOk').onclick=()=>{
  const v={t:$('fTitle').value.trim(), d:$('fDue').value||null, r:$('fRem').value||null, c:pick($('fCat'))||'기타', p:pick($('fPrio'))||'보통', m:$('fMemo').value.trim()||null};
  if(!v.t){ (tg&&tg.showAlert)?tg.showAlert('할 일을 입력해 주세요.'):alert('할 일을 입력해 주세요.'); return; }
  let x=editing;
  if(!x){ x={i:'new'+(++tmpN), s:'open'}; items.unshift(x); }
  Object.assign(x,v);
  const op={op:x.i.startsWith('new')?'add':'edit', id:x.i.startsWith('new')?undefined:x.i, title:v.t, due:v.d, remind:v.r, cat:v.c, prio:v.p, memo:v.m};
  ops.set(x.i, op); closeForm();
};
function payload(){
  const list=[...ops.entries()].map(([k,o])=>{ if(o.op==='add'){ const x=items.find(y=>y.i===k); if(x&&x.s==='done') return null; } return o; }).filter(Boolean);
  // 새로 추가하고 바로 완료한 건은 보내지 않음
  return JSON.stringify({v:1, ops:list});
}
function updateMain(){
  if(!tg) return; const n=ops.size;
  if(n){ tg.MainButton.setText('저장 ('+n+'건)'); tg.MainButton.show(); } else tg.MainButton.hide();
}
if (tg) tg.MainButton.onClick(()=>{
  const p = payload(); if (new TextEncoder().encode(p).length > 4000) { tg.showAlert('한 번에 바꾼 내용이 너무 많아요. 나눠서 저장해 주세요.'); return; }
  tg.sendData(p);
});
$('tOpen').onclick=()=>{tab='open';$('tOpen').classList.add('on');$('tDone').classList.remove('on');render();};
$('tDone').onclick=()=>{tab='done';$('tDone').classList.add('on');$('tOpen').classList.remove('on');render();};
render();
})();
</script>
</body>
</html>
